[pytest]
testpaths = tests
markers =
    local_data: needs the real private ERP exports in ./data (skipped automatically when absent; never runs in CI)
    production_gate: runs the real M8-ACCURACY production gate instead of the test-only algorithm harness
    production_auth: resolves the M8-CP1 owner session for real instead of the test-only owner harness
filterwarnings =
    ignore:Workbook contains no default style:UserWarning
    ignore::DeprecationWarning
