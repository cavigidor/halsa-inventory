name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Standard suite: synthetic fixtures only. No ERP data, no API key, no paid calls.
      # local_data tests skip themselves when ./data is absent.
      - run: python -m pytest -q
        env:
          AI_PROVIDER: disabled
